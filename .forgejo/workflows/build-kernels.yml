name: Build kernels

on:
  workflow_dispatch:

jobs:
  matrix:
    name: Generate matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-25.11
      - uses: actions/checkout@v6
      - name: Build matrix
        id: matrix
        env:
          RUNS_ON: |
            {
                "aarch64-linux": "ubuntu-24.04-arm",
                "x86_64-linux": "ubuntu-24.04"
            }
        run: |
          matrix="$(
            nix eval --json .#packages | \
              jq -e --argjson runson "$RUNS_ON" '[. | to_entries | .[] | .key as $key | foreach (.value | keys | .[]) as $package (null; {"platform": $key, "runs-on": "\($runson[$key])", package: $package})]'
          )"
          matrix="$(jq -n '[{"platform": "x86_64-linux", "runs-on": "ubuntu-24.04", "package": "linux_7_0"}]')"
          separator="matrix-$RANDOM"
          {
            echo "matrix<<$separator"
            echo "$matrix" | jq -e .
            echo "$separator"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  build:
    name: Build kernel
    needs: matrix
    strategy:
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.matrix) }}
    runs-on: "${{ matrix.runs-on }}"
    steps:
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            max-jobs = 1
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v6
      - name: Build
        id: build
        env:
          PACKAGE: ${{ matrix.package }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          OUTPUT_NAMES="$(nix eval --json ".#packages.${PLATFORM}.${PACKAGE}.outputs" | jq -r '.[]')"
          mapfile -t OUTPUTS <<<"$OUTPUT_NAMES"
          TARGETS=()
          for output in "${OUTPUTS[@]}"; do
            TARGETS=(
              "${TARGETS[@]}"
              ".#packages.${PLATFORM}.${PACKAGE}.${output}"
            )
          done
          echo "Building ${TARGETS[*]}"
          # BUILDS="$(nix build "${TARGETS[@]}" --print-out-paths --print-build-logs)"

          # separator="builds-$RANDOM"
          # {
          #   echo builds<<"$separator"
          #   echo "$BUILDS"
          #   echo "$separator"
          # } >> "$GITHUB_OUTPUT"

      - name: Configure wg
        env:
          WG_REMOTE: ${{ secrets.WG_REMOTE }}
          WG_PRIVATE: ${{ secrets.WG_PRIVATE }}
          WG_REMOTE_PUBLIC: ${{ secrets.WG_REMOTE_PUBLIC }}
          WG_REMOTE_IP: ${{ secrets.WG_REMOTE_IP }}
          WG_IP: ${{ secrets.WG_IP }}
        run: |
          sudo apt install wireguard
          echo "$WG_PRIVATE}" > privatekey
          sudo ip link add dev wg0 type wireguard
          sudo ip address add dev wg0 "${WG_IP}" peer "${WG_REMOTE_IP}"
          sudo wg set wg0 listen-port 51820 \
            private-key privatekey \
            peer "${WG_REMOTE_PUBLIC}" \
            allowed-ips "${WG_REMOTE_IP}/32" endpoint "${WG_REMOTE}"
          sudo ip link set up dev wg0

          echo "${WG_REMOTE_IP} attic.jagoe.eu" | sudo tee -a /etc/hosts

          curl -v https://attic.jagoe.eu

      - name: Push packages to cache
        # env:
        #   BUILDS: ${{ steps.build.outputs.builds }}
        run: |
          # mapfile -t BUILD_PATHS <<<"$BUILDS"
          # for item in "${BUILD_PATHS[@]}"; do
          #   echo "Caching $item"
          # done
          nix run nixpkgs#attic-client -- --help
