name: Auto-merge flake updates

on:
  pull_request:
    types: [labeled]

jobs:
  enable-automerge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'nixos-kernels-pull-requests[bot]' && contains(github.event.pull_request.labels.*.name, 'ci/update/flakes')
    steps:
      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PR_CREATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PR_CREATE_APP_PRIVATE_KEY }}

      - name: Enable auto-merge
        uses: alexwilson/enable-github-automerge-action@2c32e18a76e0726ffe7a573bfff2d42a20885126  # v3.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
