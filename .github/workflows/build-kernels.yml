name: Build kernels

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CACHIX_REPO_NAME: nixos-surface-kernel
  CACHIX_PUBLIC_KEY: nixos-surface-kernel.cachix.org-1:0NRj1XcsGihDlexYdGuRHrxP+yX8o15HUTvk4m6yGVk=

jobs:
  matrix:
    name: Generate matrix
    runs-on: ubuntu-latest
    outputs:
      continue: ${{ steps.matrix.outputs.continue }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build matrix
        id: matrix
        run: |
          bash .github/scripts/build-matrix.sh

  build:
    name: Build kernel
    if: needs.matrix.outputs.continue == 'true'
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:${{ matrix.nixos-release }}

      - uses: cachix/cachix-action@v17
        with:
          name: ${{ env.CACHIX_REPO_NAME }}
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Filter build targets
        id: filter-builds
        env:
          BUILD: ${{ matrix.build }}
          CACHIX_AUTH_TOKEN: '${{ secrets.CACHIX_METADATA_TOKEN }}'
        run: |
          BUILD_TARGETS="$(nix eval --json "${BUILD}.outputs" | jq -er --arg target "$BUILD" 'foreach .[] as $output (null; "\($target).\($output)")')"
          mapfile -t TARGETS <<< "$BUILD_TARGETS"
          declare -a FINAL_TARGETS

          for target in "${TARGETS[@]}"; do
            store_path="$(nix eval --json "$target" | jq -er .)"
            narinfo="${${store_path//*\//}//-*/}.narinfo"
            encoded_store_path="$(echo "${store_path}" | sed 's/\//%2F/g')"
            cachix_resp="$(curl -fsSL \
              -H "Accept: application/json" \
              -H "Authorization: Bearer $CACHIX_AUTH_TOKEN" \
              "https://cachix.org/api/v1/cache/${CACHIX_REPO_NAME}/search/${encoded_store_path}")"
            exists="$(echo "$cachix_resp" | jq -r '(. | length) > 0')"
            if [[ "$exists" == "true" ]]; then
              echo "Skipping build of already-cached $target"
              echo "$store_path is already in cache"
            else
              if ! curl -fsSL "https://cache.nixos.org/${narinfo}" >/dev/null; then
                FINAL_TARGETS=("${FINAL_TARGETS[@]}" "$target")
              fi
            fi
          done

          if [ "${#FINAL_TARGETS[@]}" -eq 0 ]; then
            echo "Nothing to do"
            {
              echo targets=
              echo build-required=false
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          separator="build-targets-$RANDOM"
          {
            echo "targets<<$separator"
            for item in "${FINAL_TARGETS[@]}"; do
              echo "$item"
            done
            echo "$separator"
            echo build-required=true
          } >> "$GITHUB_OUTPUT"

      - name: Clean disk
        if: steps.filter-builds.outputs.build-required == 'true'
        uses: sjagoe/avrea-disk-space-action@v1.0.2

      - name: Build
        if: steps.filter-builds.outputs.build-required == 'true'
        env:
          TARGETS: ${{ steps.filter-builds.outputs.targets }}
        run: |
          OPTIONS=(
            --no-link
            --print-out-paths
            --print-build-logs
            --option extra-substituters "https://${CACHIX_REPO_NAME}.cachix.org"
            --option extra-trusted-public-keys "${CACHIX_PUBLIC_KEY}"
          )
          mapfile -t FINAL_TARGETS <<< "$TARGETS"
          echo "Building targets ${FINAL_TARGETS[*]}"
          nix build "${FINAL_TARGETS[@]}" "${OPTIONS[@]}"

  build-completed:
    name: Build completed
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: ["build"]
    steps:
      - name: Finalize overall build status status
        env:
          STATE: ${{ needs.build.result }}
        run: |
          [[ "$STATE" == "success" ]] || [[ "$STATE" == "skipped" ]]
