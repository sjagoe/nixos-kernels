name: Build kernels

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  matrix:
    name: Generate matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-26.05

      - name: Build matrix
        id: matrix
        run: |
          builds="$(nix eval --json .#ci.build)"
          separator="matrix-$RANDOM"
          {
            echo "matrix<<$separator"
            echo "$builds" | jq -e .
            echo "$separator"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  build:
    name: Build kernel
    needs: matrix
    strategy:
      matrix:
        build: ${{ fromJson(needs.matrix.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-26.05

      - uses: cachix/cachix-action@v14
        with:
          name: nixos-kernels
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build
        env:
          BUILD: ${{ matrix.build }}
        run: |
          BUILD_TARGETS="$(nix eval --json "${BUILD}.outputs" | jq -er --arg target "$BUILD" 'foreach .[] as $output (null; "\($target).\($output)")')"
          OPTIONS=(
            --no-link
            --print-out-paths
            --print-build-logs
          )
          mapfile -t TARGETS <<< "$BUILD_TARGETS"
          echo "Building targets ${TARGETS[*]}"
          nix build "${TARGETS[@]}" "${OPTIONS[@]}"
