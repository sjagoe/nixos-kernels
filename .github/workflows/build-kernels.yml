name: Build kernels

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - README.md
      - .github/workflows/update.yml
      - .github/scripts/create-pr.sh
      - .github/scripts/generate-readme.sh
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - .github/workflows/update.yml
      - .github/scripts/create-pr.sh
      - .github/scripts/generate-readme.sh

jobs:
  matrix:
    name: Generate matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build matrix
        id: matrix
        run: |
          echo "Store paths to build"
          nix eval --json .#packages | jq .
          echo "===="
          builds="$(nix eval --json .#ci.build)"
          separator="matrix-$RANDOM"
          {
            echo "matrix<<$separator"
            echo "$builds" | jq -e .
            echo "$separator"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  build:
    name: Build kernel
    needs: matrix
    strategy:
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Clean disk
        uses: sjagoe/avrea-disk-space-action@v1.0.2

      - name: Checkout
        uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:${{ matrix.nixos-release }}

      - uses: cachix/cachix-action@v17
        with:
          name: nixos-kernels
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build
        env:
          BUILD: ${{ matrix.build }}
          CACHIX_AUTH_TOKEN: '${{ secrets.CACHIX_METADATA_TOKEN }}'
        run: |
          BUILD_TARGETS="$(nix eval --json "${BUILD}.outputs" | jq -er --arg target "$BUILD" 'foreach .[] as $output (null; "\($target).\($output)")')"
          OPTIONS=(
            --no-link
            --print-out-paths
            --print-build-logs
          )
          mapfile -t TARGETS <<< "$BUILD_TARGETS"
          declare -a FINAL_TARGETS

          for target in "${TARGETS[@]}"; do
            store_path="$(nix eval --json "$target" | jq -er . | sed 's/\//%2F/g')"
            cachix_resp="$(curl -fsSL \
              -H "Accept: application/json" \
              -H "Authorization: Bearer $CACHIX_AUTH_TOKEN" \
              "https://cachix.org/api/v1/cache/nixos-kernels/search/${store_path}")"
            exists="$(echo "$cachix_resp" | jq -r '(. | length) > 0')"
            if [[ "$exists" == "true" ]]; then
              echo "Skipping build of already-cached $target"
            else
              FINAL_TARGETS=("${FINAL_TARGETS[@]}" "$target")
            fi
          done

          if [ "${#FINAL_TARGETS[@]}" -eq 0 ]; then
            echo "Nothing to do"
            exit 0
          fi

          echo "Building targets ${FINAL_TARGETS[*]}"
          nix build "${FINAL_TARGETS[@]}" "${OPTIONS[@]}"

  build-completed:
    name: Build completed
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: ["build"]
    steps:
      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PR_CREATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PR_CREATE_APP_PRIVATE_KEY }}

      - name: Finalize overall build status status
        env:
        TARGET_URL: "$https://github.com/${{ github.repository }}/actions/runs/${{ github.run_number }}"
          STATE: ${{ needs.build.result }}
          STATUS_TOKEN: ${{ steps.app-token.outputs.token }}
          CONTEXT: ci/build/status
        run: |
          if [[ "$STATE" != "pending" ]] && [[ "$STATE" != "success" ]] && [[ "$STATE" != "failure" ]]; then
              STATE="error"
          fi

          data="$(jq -ne --arg url "$TARGET_URL" --arg state "$STATE" --arg context "$CONTEXT" \
                     '{context:$context,state:$state,target_url:$url}')"
          curl -fsSL \
               -H "Authorization: Bearer $STATUS_TOKEN" \
               -H "Accept: application/json" \
               -H "Content-Type: application/json" \
               -X POST \
               -d "$data" \
               "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"
